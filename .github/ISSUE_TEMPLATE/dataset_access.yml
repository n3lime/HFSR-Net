name: Dataset Access Request
description: Request information regarding access to the SODP dataset.
title: "[Dataset Request] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in the SODP dataset.
        Please provide the following information to enquire about data access.
  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      description: Your institution or organization.
      placeholder: University / Research Institute
    validations:
      required: true
  - type: input
    id: research_area
    attributes:
      label: Research Area
      description: Briefly describe your research area.
      placeholder: Remote sensing, object detection, forestry, etc.
    validations:
      required: true
  - type: textarea
    id: intended_use
    attributes:
      label: Intended Use
      description: Briefly describe your intended research use of the dataset.
    validations:
      required: true
